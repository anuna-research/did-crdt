# Fly.io deployment for the did-crdt HTTP resolver.
#
# Runs the full node (service + sync): axum HTTP API in front of the CRDT
# DocStore, with pkarr DHT discovery and iroh-gossip delta propagation.
#
#   POST /dids              create a DID
#   GET  /:did              resolve a DID document
#   POST /dids/:did/deltas  submit a signed delta
#   GET  /metrics           prometheus metrics (also the health check)

app            = "did-crdt-resolver"
primary_region = "syd"

# OOM cushion for a 256MB machine — iroh's QUIC stack is the memory-hungry part.
# Must be top-level: nested under [[vm]] it is silently ignored.
swap_size_mb = 512

[build]
  dockerfile = "Dockerfile"

[env]
  LISTEN_ADDR  = "0.0.0.0:8080"
  STORAGE_PATH = "/data"
  RUST_BACKTRACE = "1"

  # Cold-start resolution budget. Fly's proxy will hold the request, but keep
  # the total under a typical client timeout.
  RESOLVE_TIMEOUT_MS    = "10000"
  DHT_LOOKUP_TIMEOUT_MS = "5000"

[mounts]
  source       = "did_crdt_data"
  destination  = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 8080
  force_https   = true
  processes     = ["app"]

  # Always-on: in-memory CRDT state does not survive a machine stop, so the
  # machine must not be allowed to idle out.
  auto_stop_machines   = "off"
  auto_start_machines  = true
  min_machines_running = 1

  [http_service.concurrency]
    type       = "requests"
    soft_limit = 50
    hard_limit = 100

  # /metrics is registered ahead of the dynamic /:did route, so it is a stable
  # 200 that does not depend on any DID existing.
  [[http_service.checks]]
    interval      = "30s"
    timeout       = "5s"
    grace_period  = "60s"
    method        = "GET"
    path          = "/metrics"

# Smallest machine Fly offers: 1 shared vCPU, 256MB.
[[vm]]
  size   = "shared-cpu-1x"
  memory = "256mb"
  cpus   = 1
