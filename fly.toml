# Fly.io deployment for the did-crdt HTTP resolver.
#
# Runs the full node (service + sync): axum HTTP API in front of the CRDT
# DocStore, with pkarr DHT discovery and iroh-gossip delta propagation.
#
#   POST /dids              create a DID
#   GET  /:did              resolve a DID document
#   POST /dids/:did/deltas  submit a signed delta
#   GET  /metrics           prometheus metrics
#   GET  /health            liveness + storage/sync status (the health check)

app            = "did-crdt-resolver"
primary_region = "syd"

# OOM cushion for a 256MB machine — iroh's QUIC stack is the memory-hungry part.
# Must be top-level: nested under [[vm]] it is silently ignored.
swap_size_mb = 512

[build]
  dockerfile = "Dockerfile"

[env]
  LISTEN_ADDR  = "0.0.0.0:8080"
  STORAGE_PATH = "/data"
  RUST_BACKTRACE = "1"

  # Cold-start resolution budget. Fly's proxy will hold the request, but keep
  # the total under a typical client timeout.
  RESOLVE_TIMEOUT_MS    = "10000"
  DHT_LOOKUP_TIMEOUT_MS = "5000"

[mounts]
  source       = "did_crdt_data"
  destination  = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 8080
  force_https   = true
  processes     = ["app"]

  # Snapshots are durable on the volume now, but the volume binds the app to a
  # single machine anyway, so there is nothing to gain from stopping it.
  auto_stop_machines   = "off"
  auto_start_machines  = true
  min_machines_running = 1

  [http_service.concurrency]
    type       = "requests"
    soft_limit = 50
    hard_limit = 100

  # /health touches only in-process state, so it stays a true liveness signal:
  # a check that reached for the DHT would fail the machine out of rotation
  # whenever a remote service had a bad minute.
  [[http_service.checks]]
    interval      = "30s"
    timeout       = "5s"
    grace_period  = "60s"
    method        = "GET"
    path          = "/health"

# Smallest machine Fly offers: 1 shared vCPU, 256MB.
[[vm]]
  size   = "shared-cpu-1x"
  memory = "256mb"
  cpus   = 1
