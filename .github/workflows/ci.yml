name: CI

# Third-party actions are fully qualified. Forgejo resolves a bare
# `uses: owner/repo` against its own action host, which mirrors `actions/*`
# and nothing else — so `dtolnay/rust-toolchain` and `Swatinem/rust-cache`
# resolved to "repository not found" and every job died during setup, before
# a single step ran. `actions/checkout` is left bare because that one IS
# mirrored.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: https://github.com/dtolnay/rust-toolchain@stable
      - uses: https://github.com/Swatinem/rust-cache@v2
      - run: cargo test

  core-no-std-io:
    name: Core — no default features (forbids I/O & async imports)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: https://github.com/dtolnay/rust-toolchain@stable
      - uses: https://github.com/Swatinem/rust-cache@v2
      - run: cargo build --no-default-features

  lint:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: https://github.com/Swatinem/rust-cache@v2
      - run: cargo clippy --all-features -- -D warnings
